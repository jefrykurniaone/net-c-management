name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    checks:
        name: Lint, Types, Tests & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run TypeScript type check
              run: npx tsc --noEmit

            - name: Run tests
              run: npm test

            # Last, because it is the slowest and the three checks above
            # localise a failure faster. Placeholder values only: the build
            # imports modules that assert their environment exists —
            # src/lib/supabase.ts throws at module scope — but every route in
            # this app is server-rendered on demand, so nothing connects to a
            # database, a storage bucket or an OAuth provider while building.
            # Real values would buy nothing and would be a secret in a log.
            #
            # Retried twice because `next/font/google` fetches Archivo from
            # Google Fonts at build time, and that fetch is the one flake this
            # repo sees regularly — the execution maps already say it is retried
            # rather than treated as a failure. A genuine build failure costs one
            # extra attempt; a DNS blip costs nothing.
            - name: Build
              run: |
                  for attempt in 1 2; do
                      if npm run build; then
                          exit 0
                      fi
                      echo "::warning::Build attempt $attempt failed; retrying in 15s"
                      sleep 15
                  done
                  echo "::error::Build failed twice"
                  exit 1
              env:
                  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
                  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
                  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
                  AUTH_SECRET: placeholder-auth-secret
                  AUTH_GOOGLE_ID: placeholder-google-id
                  AUTH_GOOGLE_SECRET: placeholder-google-secret
